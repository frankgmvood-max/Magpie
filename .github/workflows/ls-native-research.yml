name: LS native research checks
on:
  push:
    branches: [ls-native-dlss-research]
    paths: ['experiments/LS-Native-DLSS/**', '.github/workflows/ls-native-research.yml']
  pull_request:
    paths: ['experiments/LS-Native-DLSS/**', '.github/workflows/ls-native-research.yml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Parser rejection and token tests
        run: python -m unittest discover -s experiments/LS-Native-DLSS/tests -p 'test_*.py' -v
      - name: Native slot invariants
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic experiments/LS-Native-DLSS/tests/test_slot_policy.cpp -o /tmp/slot-policy
          /tmp/slot-policy
      - name: Observation snapshots and concurrent queue
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread experiments/LS-Native-DLSS/tests/test_observation.cpp -o /tmp/observation-tests
          /tmp/observation-tests
  windows-tool:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - name: Configure standalone proxy, tools and ABI fixture
        run: |
          cmake -S experiments/LS-Native-DLSS/observer -B build/native-observer -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-observer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native Windows queue, slot and forwarding tests
        run: ctest --test-dir build/native-observer -C Release --output-on-failure
