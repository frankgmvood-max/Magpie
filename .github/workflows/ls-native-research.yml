name: LS native research checks
on:
  push:
    branches: [ls-native-dlss-research]
    paths: ['experiments/LS-Native-DLSS/**', '.github/workflows/ls-native-research.yml']
  pull_request:
    paths: ['experiments/LS-Native-DLSS/**', '.github/workflows/ls-native-research.yml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Parser rejection and token tests
        run: python -m unittest discover -s experiments/LS-Native-DLSS/tests -p 'test_*.py' -v
      - name: Native slot invariants
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic experiments/LS-Native-DLSS/tests/test_slot_policy.cpp -o /tmp/slot-policy
          /tmp/slot-policy
      - name: Observation snapshots and concurrent queue
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread experiments/LS-Native-DLSS/tests/test_observation.cpp -o /tmp/observation-tests
          /tmp/observation-tests
      - name: Observed source update pairing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic experiments/LS-Native-DLSS/tests/test_source_pair.cpp -o /tmp/source-pair-tests
          /tmp/source-pair-tests
  windows-tool:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned official NVIDIA SDK
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NVIDIA/DLSS.git build/ngx-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/ngx-sdk sparse-checkout set include lib/Windows_x86_64/x64
          git -C build/ngx-sdk checkout 374959484e79a640feaba44c93ac8cfb0a03f5b5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure standalone proxy, tools and ABI fixture
        run: |
          cmake -S experiments/LS-Native-DLSS/observer -B build/native-observer -A x64 -DLS_ENABLE_NGX=ON -DNGX_ROOT="${{ github.workspace }}/build/ngx-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-observer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native Windows queue, slot, forwarding and GPU snapshot tests
        run: ctest --test-dir build/native-observer -C Release --output-on-failure
      - name: Verify original native export names and ordinals
        run: python experiments/LS-Native-DLSS/tools/verify_proxy_exports.py build/native-observer/Release/Lossless.dll
      - name: Verify installer, rollback and script syntax
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File experiments/LS-Native-DLSS/tests/windows/test_package.ps1
      - name: Package standalone native build
        shell: pwsh
        run: |
          $out = 'build/LS-Native-DLSS-0.2.0'
          New-Item -ItemType Directory -Path "$out/licenses" -Force | Out-Null
          Copy-Item experiments/LS-Native-DLSS/package/* $out
          Copy-Item build/native-observer/Release/Lossless.dll $out
          Copy-Item experiments/LS-Native-DLSS/observer/NativeDLSS.ini $out
          Copy-Item experiments/LS-Native-DLSS/observer/NOTICE.md $out
          Copy-Item src/Magpie.Core/third_party/minhook/LICENSE.txt "$out/licenses/MINHOOK-LICENSE.txt"
          Copy-Item build/ngx-sdk/LICENSE.txt "$out/licenses/NVIDIA-RTX-SDK-LICENSE.txt"
          Copy-Item experiments/LS-Native-DLSS/third_party/nvof/*.h "$out/licenses"
          Get-ChildItem $out -Filter '*.ps1' | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            [IO.File]::WriteAllText($_.FullName, $text, [Text.UTF8Encoding]::new($true))
          }
          '${{ github.sha }}' | Set-Content "$out/build-commit.txt" -Encoding utf8
          Get-ChildItem $out -Recurse -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetRelativePath((Resolve-Path $out), $_.FullName))"
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: LS-Native-DLSS-0.2.0
          path: build/LS-Native-DLSS-0.2.0/
          retention-days: 90
          if-no-files-found: error
