name: LS experimental addon suite
on:
  workflow_dispatch:
  push:
    paths: ['experiments/LS-*/**', '.github/workflows/ls-dlssfg.yml']
  pull_request:
    paths: ['experiments/LS-*/**', '.github/workflows/ls-dlssfg.yml']
permissions:
  contents: read
jobs:
  addon:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned manager SDK
        uses: actions/checkout@v4
        with:
          repository: Echo-Storm/ls-addon-manager
          ref: fbcc3c179e4052785c032d157d8eb785608eb28e
          path: dependencies/eam
          persist-credentials: false
      - name: Fetch pinned NGX SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: 374959484e79a640feaba44c93ac8cfb0a03f5b5
          path: dependencies/dlss
          persist-credentials: false
      - name: Configure
        run: |
          pwsh -File scripts/Fetch-NvapiHeaders.ps1 -OutputDirectory dependencies/nvapi-sdk
          if ($LASTEXITCODE) { throw 'NVAPI header fetch failed' }
          pwsh -File scripts/Fetch-RtxVideoSdk.ps1 -Destination dependencies/rtx-video
          if ($LASTEXITCODE) { throw 'RTX Video SDK fetch failed' }
          cmake -S experiments/LS-Addons -B out/ls-fg -A x64 -DEAM_ROOT="${{ github.workspace }}/dependencies/eam" -DNGX_ROOT="${{ github.workspace }}/dependencies/dlss" -DNVAPI_ROOT="${{ github.workspace }}/dependencies/nvapi-sdk" -DRTX_VIDEO_ROOT="${{ github.workspace }}/dependencies/rtx-video"
      - name: Build x64 addons
        run: cmake --build out/ls-fg --config Release --parallel
      - name: Test ABI, GPU transport, recovery and frame processing order
        run: ctest --test-dir out/ls-fg -C Release --output-on-failure
      - name: Verify portable timing collector and pinned PresentMon
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'experiments/LS-DLSSFG/package/Capture-Pacing.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          powershell -NoProfile -ExecutionPolicy Bypass -File experiments/LS-DLSSFG/package/Capture-Pacing.ps1 -PrepareOnly
          if ($LASTEXITCODE) { throw 'Timing collector verification failed' }
      - name: Package
        shell: pwsh
        run: |
          cmake --install out/ls-fg --config Release --prefix out/package
          if ($LASTEXITCODE) { throw 'Package install failed' }
          Copy-Item dependencies/dlss/LICENSE.txt out/package/addons/LS_DLSSFG/NVIDIA-LICENSE.txt
          Copy-Item out/ls-fg/_deps/imgui-src/LICENSE.txt out/package/addons/LS_DLSSFG/IMGUI-LICENSE.txt
          git rev-parse HEAD | Set-Content out/package/build-commit.txt
          git rev-parse HEAD | Set-Content out/package/addons/LS_DLSSFG/build-commit.txt
          Copy-Item scripts/Fetch-RtxVideoSdk.ps1,scripts/Fetch-NvapiHeaders.ps1 out/package/source
          Get-ChildItem out/package -Filter *.dll -Recurse | Get-FileHash -Algorithm SHA256 | Format-List | Out-File out/package/SHA256.txt
          Copy-Item experiments/LS-DLSSFG/package out/package/addons/LS_DLSSFG/source/package -Recurse
          Copy-Item experiments/LS-DLSSFG/README-RU.md,experiments/LS-DLSSFG/NOTICE.md,experiments/LS-DLSSFG/LICENSE,experiments/LS-DLSSFG/LICENSE-EAM,experiments/LS-DLSSFG/RESEARCH.md out/package/addons/LS_DLSSFG/source
          Get-FileHash out/package/addons/LS_DLSSFG/LS_DLSSFG.dll -Algorithm SHA256 | Format-List | Out-File out/package/addons/LS_DLSSFG/SHA256.txt
      - name: Verify update preserves working FG runtime, settings and manager
        run: pwsh -File experiments/LS-Addons/tests/install_package.ps1 -PackageDirectory out/package
      - uses: actions/upload-artifact@v4
        with:
          name: LS-Addons-x64-${{ github.sha }}
          path: out/package
          if-no-files-found: error
