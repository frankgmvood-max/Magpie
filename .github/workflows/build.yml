name: build

on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/build.yml', 'Magpie.slnx', '*.props', 'scripts/publish.py', 'src/**' ]
  pull_request:
    paths: [ '.github/workflows/build.yml', 'Magpie.slnx', '*.props', 'scripts/publish.py', 'src/**' ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        # VRR debug build: keep CI focused on the Windows x64 binary we will test.
        # Current upstream ClangCL fails on an unrelated -Wunused-function warning.
        compiler: ["MSVC"]
        platform: ["x64"]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Setup Conan
      run: pip install conan

    - name: Load Conan cache
      uses: actions/cache@v6
      with:
        path: ~/.conan2/p
        key: Conan-${{ hashFiles('src/**/conanfile.txt') }}-${{ matrix.compiler }}-${{ matrix.platform }}

    - name: Fetch NVIDIA DLSS headers
      if: matrix.platform == 'x64'
      shell: pwsh
      run: |
        git clone --depth 1 https://github.com/NVIDIA/DLSS.git dependencies/DLSS-main
        ./scripts/Fetch-NvapiHeaders.ps1 -OutputDirectory dependencies/nvapi-sdk
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <PropertyGroup>
            <EnableDLSSFrameGeneration>true</EnableDLSSFrameGeneration>
            <DLSSSdkDir>$([System.IO.Path]::GetFullPath('dependencies/DLSS-main'))</DLSSSdkDir>
            <NvapiSdkDir>$([System.IO.Path]::GetFullPath('dependencies/nvapi-sdk'))</NvapiSdkDir>
          </PropertyGroup>
        </Project>
        "@ | Set-Content -Path src/BuildOptions.props.user -Encoding utf8

    - name: Build
      if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
      run: python scripts/publish.py --compiler=${{ matrix.compiler }} --platform=${{ matrix.platform }}

    - name: Build and sign
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
      run: python scripts/publish.py --compiler=${{ matrix.compiler }} --platform=${{ matrix.platform }} --pfx-path=certs\Magpie.pfx --pfx-password="${{ secrets.MAGPIE_PFX_PASSWORD }}"

    - name: Save hash
      id: hash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

    - name: Store build
      uses: actions/upload-artifact@v7
      with: 
          name: Magpie-dev-${{ steps.hash.outputs.sha_short }}-${{ matrix.compiler }}-${{ matrix.platform }}
          path: ./publish/${{ matrix.platform }}
