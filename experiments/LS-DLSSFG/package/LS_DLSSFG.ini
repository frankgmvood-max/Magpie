[FrameGeneration]
; Use legal sync=0 + ALLOW_TEARING for both FG frames when the LS chain permits it.
PreferVRR=1
; 1: bounded output queue; 0: preserve LS queue. Restored on stop/failure.
MaximumFrameLatency=1
; Native LSFG MUST be off before this becomes 1.
; Run Activate-136FPS.cmd or Activate-Adaptive.cmd after disabling it.
NativeLSFGDisabled=0
; 136: 68 real + 68 generated. 0: estimate base cadence.
TargetFPS=136

; 0.3.0: NVOF, exact RGB duplicate detection and runtime-limited MFG
Multiplier=2
OpticalFlowMethod=2
NvidiaOpticalFlowQuality=2
; Analysis only: 50% width/height; full-resolution colour and motion output.
OpticalFlowScale=50
DuplicateFrameFiltering=1
GeneratedPresentAPI=0
; Read once per output initialization by default; repeated NVAPI calls can stall.
PeriodicDriverQueries=0

; Rebuild features/history after minimize and sustained runtime refusal.
AutomaticRecovery=1
