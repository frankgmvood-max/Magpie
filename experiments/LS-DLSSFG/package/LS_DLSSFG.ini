[FrameGeneration]
; Use legal sync=0 + ALLOW_TEARING for both FG frames when the LS chain permits it.
PreferVRR=1
; Native LSFG MUST be off before this becomes 1.
; Run Activate-136FPS.cmd or Activate-Adaptive.cmd after disabling it.
NativeLSFGDisabled=0
; 136: 68 real + 68 generated. 0: estimate base cadence.
TargetFPS=136
