[NativeDLSS]
; Experimental native LSFG3 Fixed x2 SDR replacement. Restart LS after GPU quality edits.
Enabled=1
; 0=LS native, 1=DLSS hybrid, 2=DLSS economy (repeat source on fallback).
Mode=2
; Explicitly selected per-application profile. Empty uses this section.
ActiveProfile=
DuplicateFilter=1
DuplicateDelta=0
SceneCut=1
CutDelta=64
CutPercent=65
; HUD1..HUD8: left,top,right,bottom in 0..10000 (relative to captured image).
HUD1=
HUD2=
HUD3=
HUD4=
HUD5=
HUD6=
HUD7=
HUD8=
OpticalFlow=1
; Independent controls. 0 migrates old Quality; presets 1=Fast,2=Medium,3=Slow.
FlowPreset=0
; 0 migrates Quality; otherwise 2 or 4 pixels (unsupported 2 falls back to 4).
FlowGrid=0
; 1=Fast/4px, 2=Medium/4px, 3=Slow/4px, 4=Medium/2px, 5=Slow/2px.
; Unsupported 2px grid falls back to 4px. Higher values are more expensive.
Quality=2
AnalysisPercent=50
; 1: ordered GPU dependency. 0: replace only already completed outputs.
GPUOrdered=1
; Preallocated job count, not LS max frame latency. Range 2..4.
Slots=3

[Observation]
; Optional bounded metadata trace, separate from persistent backend log.
Enabled=0
DurationSeconds=20
MaxRecords=4096
